buildscript {
	dependencies {
		classpath "org.yaml:snakeyaml:${snakeYamlVersion}"
	}
}

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'io.franzbecker.gradle-lombok' version '5.0.0'
    id 'com.diffplug.spotless' version '8.0.0'
}

import io.franzbecker.gradle.lombok.task.DelombokTask
import org.yaml.snakeyaml.Yaml

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

def resourcesDir = sourceSets.main.resources.srcDirs.first()
def config = new Yaml().load( new File("${resourcesDir}/plugin.yml").newInputStream() )

base {
    archivesName = "${config.name}"
}
version = "${config.version}"

repositories {
    mavenCentral()
}

eclipse {
    classpath {
        downloadJavadoc = true
        downloadSources = true
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

configurations {
	// Shared libraries this plugin needs, see collectLibraries
	library
}

dependencies {
	compileOnly project(':Ikala-Core')
	compileOnly project(':Ikala-Graphics')
	
	implementation "org.joml:joml:${jomlVersion}"
	implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"
	implementation "org.lwjgl:lwjgl-assimp:${lwjglVersion}"

	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows"
	runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos"

	library "org.lwjgl:lwjgl-assimp:${lwjglVersion}"
	library "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows"
	library "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos-arm64"

	// Testing
	testImplementation project(':Ikala-Core')
	testImplementation project(':Ikala-Graphics')
	testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	
	// lombok
	compileOnly "org.projectlombok:lombok:${lombokVersion}"
	annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
	testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
	testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}

tasks.register('delombok', DelombokTask) {
	description = 'Delomboks the source code'
    ext.outputDir = file('build/src-delomboked')
    outputs.dir(outputDir)
    sourceSets.main.java.srcDirs.each { 
        inputs.dir(it)
        args(it, "-d", outputDir)
    }
    doFirst {
        outputDir.deleteDir()
    }
}

tasks.named('test') {
	useJUnitPlatform()
	testLogging {
		exceptionFormat = 'full'
		events = ['skipped', 'failed']
		showStandardStreams = true
	}
}

tasks.named('javadoc') {
	dependsOn = delombok as Iterable<?>
	source = delombok.outputDir
	failOnError = false
}

tasks.withType(Javadoc).configureEach {
	options.addStringOption('Xdoclint:-missing', '-quiet')
}

tasks.named('clean') {
	delete 'build/src-delomboked'
	delete 'bin'
	// tests generate this
	delete 'logs'
}

// Shared libraries go in the application's libs folder instead of the plugin jar, so they are only
// ever loaded once, even if this plugin is reloaded
tasks.register('collectLibraries', Copy) {
	from configurations.library
	into layout.buildDirectory.dir('libraries')
}


tasks.named('check') {
	dependsOn spotlessApply
}

spotless {
	java {
		target fileTree('.') {
			include '**/*.java'
			exclude '**/build/**', '**/build-*/**'
		}
		cleanthat().sourceCompatibility('17')
			.addMutator('SafeAndConsensual')
			.addMutator('SafeButNotConsensual')
			.addMutator('SafeButControversial')
			.excludeMutator('AvoidInlineConditionals')
			.includeDraft(false)
		googleJavaFormat('1.21.0').aosp()
		// eclipse('4.27').configFile('formatting.xml')
		toggleOffOn()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		importOrder('\\#', 'com.ikalagaming', '', 'java|javax')
		formatAnnotations()
	}
}
