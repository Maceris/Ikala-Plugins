---
icon-path: 'textures/game_icon.png'
filters-folder: 'shaders/filters'
# Where built level of detail cells are cached, so an area seen before loads without rebuilding;
# empty for no cache. Compiled shaders are cached in a shaders folder inside it.
lod-cache-folder: 'cache/lod'
# The most the cache keeps, in mebibytes; the least recently used cells go first
lod-cache-max-mb: 2048
# Whether GUI windows can be dragged out of the main window into windows of their own
gui-viewports: true
# Where window positions, sizes and docking are saved between runs, in this config folder; empty
# to not save them
gui-layout-file: 'gui.ini'
