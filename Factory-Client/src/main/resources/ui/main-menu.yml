# The game's main menu. The handlers and @ text come from GameMenus.java and the plugin's
# strings.properties.
surface:
  id: factory/main-menu
  anchors: fill
  layer: background

templates:
  menu-button:
    params: [id, text, action, focus]
    node:
      type: button
      id: "${id}"
      text: "${text}"
      width: 240
      height: 40
      autofocus: "${focus}"
      onClick: "${action}"

content:
  type: column
  id: content
  justify: center
  align: center
  gap: 16
  children:
    - type: label
      id: note
      text: "{note}"
      classes: [error-text]
      visible: "{hasNote}"
    - type: column
      id: buttons
      gap: 12
      align: center
      children:
        - use: menu-button
          with: { id: single-player, text: "@MENU_MAIN_MENU_SINGLE_PLAYER", action: open-single-player, focus: true }
        - use: menu-button
          with: { id: multiplayer, text: "@MENU_MAIN_MENU_MULTI_PLAYER", action: open-multiplayer, focus: false }
        - use: menu-button
          with: { id: options, text: "@MENU_MAIN_MENU_OPTIONS", action: open-options, focus: false }
        - use: menu-button
          with: { id: quit, text: "@MENU_MAIN_MENU_QUIT", action: quit-game, focus: false }
