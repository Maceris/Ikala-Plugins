---
# Folders of character definitions to load, as namespace=folder. Every ID in a folder must use
# its namespace. Relative folders are from the working directory. The asset editor's test art has
# definitions written by tools/test_content/make_definitions.py:
#   - test=test_content/characters
content-folders: []

# The character editor: the rig reference file used to move characters from other rigs onto
# ikala:rig/biped, like the male mannequin (tools/blender/mannequin.py), and the
# content folder it saves designs to, as namespace=folder (it should be one of the content
# folders, so saved designs load back).
editor:
  reference: test_content/characters/mannequin/male.glb
  save-to: ""
