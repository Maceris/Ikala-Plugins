# The character editor's clip bar: which animation plays, and pausing it.
surface:
  id: characters/editor-clips
  anchors: { at: [0.5, 1], offset: [0, -12] }
  width: fit

content:
  type: row
  id: clips
  padding: 8
  gap: 8
  align: center
  children:
    - { type: button, id: previous, text: "<", width: 28, onClick: previous-clip }
    - { type: button, id: play, text: "{clip.play}", width: 64, onClick: toggle-play }
    - { type: button, id: next, text: ">", width: 28, onClick: next-clip }
    - { type: label, id: name, text: "{clip.name}", width: 260 }
    - { type: label, id: position, text: "{clip.position}", width: 70 }
